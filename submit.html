<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Data Seniman</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Space Mono dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Konfigurasi Tema Tailwind Custom -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    colors: {
                        'brutal-blue': '#2563eb',
                        'brutal-green': '#4ade80',
                        'brutal-yellow': '#fde047'
                    }
                }
            }
        }
    </script>
    <style>
        /* Pola background grid biru bergaya retro tech */
        body {
            background-color: #2563eb;
            background-image: 
                linear-gradient(#1d4ed8 2px, transparent 2px), 
                linear-gradient(90deg, #1d4ed8 2px, transparent 2px);
            background-size: 30px 30px;
        }
        /* Custom scrollbar untuk textarea agar sesuai tema */
        textarea::-webkit-scrollbar { width: 12px; border-left: 3px solid black; }
        textarea::-webkit-scrollbar-thumb { background-color: #4ade80; border: 3px solid black; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-mono text-black">

    <!-- Card Form Utama -->
    <div class="max-w-lg w-full bg-white border-4 border-black shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] relative">
        
        <!-- Header Section (Hijau) -->
        <div class="bg-brutal-green border-b-4 border-black p-6">
            <h2 class="text-3xl font-bold uppercase tracking-tighter">Data Seniman</h2>
            <p class="text-black text-sm mt-2 font-bold uppercase">Lengkapi profil Anda</p>
        </div>

        <!-- Body Form -->
        <div class="p-6 md:p-8">
            <form id="submit-to-google-sheet" class="space-y-6">
                
                <!-- Input Nama -->
                <div>
                    <label for="Nama" class="block text-lg font-bold uppercase mb-2">Nama Seniman</label>
                    <input type="text" id="Nama" name="Nama" required 
                        class="w-full px-4 py-3 bg-white border-4 border-black focus:outline-none focus:bg-brutal-yellow focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:-translate-y-1 focus:-translate-x-1 transition-all font-bold placeholder-gray-400"
                        placeholder="MASUKKAN NAMA">
                </div>

                <!-- Input Asal -->
                <div>
                    <label for="Asal" class="block text-lg font-bold uppercase mb-2">Asal</label>
                    <input type="text" id="Asal" name="Asal" required 
                        class="w-full px-4 py-3 bg-white border-4 border-black focus:outline-none focus:bg-brutal-yellow focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:-translate-y-1 focus:-translate-x-1 transition-all font-bold placeholder-gray-400"
                        placeholder="KOTA ASAL">
                </div>

                <!-- Input Bio -->
                <div>
                    <label for="Bio" class="block text-lg font-bold uppercase mb-2">Bio</label>
                    <textarea id="Bio" name="Bio" rows="4" required
                        class="w-full px-4 py-3 bg-white border-4 border-black focus:outline-none focus:bg-brutal-yellow focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:-translate-y-1 focus:-translate-x-1 transition-all font-bold resize-none placeholder-gray-400"
                        placeholder="TULIS BIO ANDA DI SINI..."></textarea>
                </div>

                <!-- Tombol Submit (Biru) -->
                <button type="submit" id="submit-btn"
                    class="w-full mt-2 bg-brutal-blue hover:bg-blue-500 text-white font-bold uppercase text-xl py-4 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:shadow-[10px_10px_0px_0px_rgba(0,0,0,1)] hover:-translate-y-1 hover:-translate-x-1 active:shadow-[0px_0px_0px_0px_rgba(0,0,0,1)] active:translate-y-1 active:translate-x-1 transition-all flex justify-center items-
