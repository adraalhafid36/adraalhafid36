<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Form Data Seniman - Brutalism</title>
    
    <!-- Memuat Tailwind CSS melalui CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Memuat Font Space Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Konfigurasi Tema Tailwind (Warna dan Font) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    colors: {
                        'brutal-blue': '#2563eb',
                        'brutal-green': '#4ade80',
                        'brutal-yellow': '#fde047'
                    }
                }
            }
        }
    </script>
    
    <!-- CSS Kustom untuk Latar Belakang dan Scrollbar -->
    <style>
        /* Mencegah default margin/padding browser */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Memastikan font diterapkan secara global jika Tailwind gagal */
            font-family: 'Space Mono', monospace;
            background-color: #2563eb;
            /* Pola Latar Belakang Grid */
            background-image: 
                linear-gradient(#1d4ed8 2px, transparent 2px), 
                linear-gradient(90deg, #1d4ed8 2px, transparent 2px);
            background-size: 40px 40px;
            min-height: 100vh;
            color: #000;
        }

        /* Styling Scrollbar Khusus untuk Textarea */
        textarea::-webkit-scrollbar { width: 12px; border-left: 3px solid black; }
        textarea::-webkit-scrollbar-thumb { background-color: #4ade80; border: 3px solid black; }
        
        /* Memastikan input text area tidak bisa di-resize oleh user (merusak layout) */
        textarea {
            resize: none;
        }
    </style>
</head>
<body class="font-mono text-black antialiased">

    <!-- Container Utama -->
    <div class="flex items-center justify-center min-h-screen px-4 py-8 w-full">
        
        <!-- Wrapper Form -->
        <div class="w-full max-w-md bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] flex flex-col">
            
            <!-- Header (Hijau) -->
            <div class="bg-brutal-green border-b-4 border-black p-5 text-center">
                <h1 class="text-3xl font-bold uppercase tracking-tight">Data Seniman</h1>
                <p class="text-sm mt-1 font-bold uppercase tracking-wide">Lengkapi Profil Seniman Partsy!!!</p>
            </div>

            <!-- Body Form (Putih) -->
            <div class="p-6">
                
                <!-- TOMBOL UPLOAD FOTO (Baru) -->
                <!-- Ganti href dengan link Google Drive kamu -->
                <div class="mb-6">
                    <a href="https://drive.google.com/drive/folders/1nurBRa8z56eakB7G7kf3n7sqd-R-muau" target="_blank" rel="noopener noreferrer" 
                        class="block w-full bg-brutal-yellow hover:bg-yellow-300 text-black font-bold uppercase text-center text-lg py-3 border-4 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] hover:shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:-translate-y-1 hover:-translate-x-1 active:shadow-[0px_0px_0px_0px_rgba(0,0,0,1)] active:translate-y-1 active:translate-x-1 transition-all flex justify-center items-center gap-2">
                        <!-- Ikon Upload (Opsional, dari SVG) -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                        </svg>
                        Upload Foto ke Drive
                    </a>
                </div>
                
                <!-- Divider (Garis Pemisah Opsional) -->
                <div class="border-b-4 border-black mb-6 border-dashed"></div>

                <form id="submit-to-google-sheet" class="flex flex-col gap-6">
                    
                    <!-- Input Nama -->
                    <div class="flex flex-col gap-2">
                        <label for="Nama" class="text-base font-bold uppercase">Nama Seniman</label>
                        <input type="text" id="Nama" name="Nama" required 
                            class="w-full px-4 py-3 bg-white border-4 border-black focus:outline-none focus:bg-brutal-yellow focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:-translate-y-1 focus:-translate-x-1 transition-all font-bold placeholder-gray-400 text-base"
                            placeholder="MASUKKAN NAMA">
                    </div>

                    <!-- Input Asal -->
                    <div class="flex flex-col gap-2">
                        <label for="Asal" class="text-base font-bold uppercase">Asal</label>
                        <input type="text" id="Asal" name="Asal" required 
                            class="w-full px-4 py-3 bg-white border-4 border-black focus:outline-none focus:bg-brutal-yellow focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:-translate-y-1 focus:-translate-x-1 transition-all font-bold placeholder-gray-400 text-base"
                            placeholder="KOTA ASAL">
                    </div>

                    <!-- Input Bio -->
                    <div class="flex flex-col gap-2">
                        <label for="Bio" class="text-base font-bold uppercase">Bio</label>
                        <textarea id="Bio" name="Bio" rows="4" required
                            class="w-full px-4 py-3 bg-white border-4 border-black focus:outline-none focus:bg-brutal-yellow focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:-translate-y-1 focus:-translate-x-1 transition-all font-bold placeholder-gray-400 text-base"
                            placeholder="TULIS BIO SENIMAN DI SINI..."></textarea>
                    </div>

                    <!-- Tombol Submit (Biru) -->
                    <button type="submit" id="submit-btn"
                        class="mt-2 w-full bg-brutal-blue hover:bg-blue-600 text-white font-bold uppercase text-xl py-4 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] hover:-translate-y-1 hover:-translate-x-1 active:shadow-[0px_0px_0px_0px_rgba(0,0,0,1)] active:translate-y-1 active:translate-x-1 transition-all flex justify-center items-center cursor-pointer">
                        <span id="btn-text">Kirim Data</span>
                        <svg id="btn-spinner" class="hidden animate-spin ml-3 h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>

                <!-- Area Pesan -->
                <div id="message-container" class="mt-6 hidden">
                    <!-- Pesan Sukses -->
                    <div id="success-message" class="hidden p-4 bg-brutal-green border-4 border-black font-bold uppercase text-center shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                        BERHASIL! DATA TERKIRIM.
                    </div>
                    
                    <!-- Pesan Error -->
                    <div id="error-message" class="hidden p-4 bg-red-500 border-4 border-black font-bold uppercase text-center shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] text-white">
                        ERROR! SILAKAN COBA LAGI.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logika Form -->
    <script>
        // URL Web App Google Apps Script
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzC6FuF5hvpM9Wq6_e-nL5j634OGjdhRlYVtMgP0JOmpuEZixzFNYWtTuIv3mgotChn/exec'; 
        
        const form = document.getElementById('submit-to-google-sheet');
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        
        const messageContainer = document.getElementById('message-container');
        const successMessage = document.getElementById('success-message');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');
            btnText.textContent = 'MENGIRIM...';
            btnSpinner.classList.remove('hidden');
            
            messageContainer.classList.add('hidden');
            successMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');

            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                    btnText.textContent = 'KIRIM DATA';
                    btnSpinner.classList.add('hidden');
                    
                    messageContainer.classList.remove('hidden');
                    successMessage.classList.remove('hidden');
                    
                    form.reset();
                    
                    setTimeout(() => {
                        messageContainer.classList.add('hidden');
                        successMessage.classList.add('hidden');
                    }, 5000);
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    
                    submitBtn.disabled = false;
                    submitBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                    btnText.textContent = 'KIRIM DATA';
                    btnSpinner.classList.add('hidden');
                    
                    messageContainer.classList.remove('hidden');
                    errorMessage.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
