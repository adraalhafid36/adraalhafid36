<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- TAMBAHAN PENTING: Mencegah layar HP tiba-tiba nge-zoom sendiri saat mengetik -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Form Data Seniman</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Space Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Konfigurasi Warna Brutalism -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    colors: {
                        'brutal-blue': '#2563eb',
                        'brutal-green': '#4ade80',
                        'brutal-yellow': '#fde047'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #2563eb;
            background-image: 
                linear-gradient(#1d4ed8 2px, transparent 2px), 
                linear-gradient(90deg, #1d4ed8 2px, transparent 2px);
            background-size: 30px 30px;
        }
        /* Desain Scrollbar untuk teks area */
        textarea::-webkit-scrollbar { width: 10px; border-left: 3px solid black; }
        textarea::-webkit-scrollbar-thumb { background-color: #4ade80; border: 3px solid black; }
    </style>
</head>
<body class="font-mono text-black">

    <!-- Wrapper yang Aman untuk Scroll di HP -->
    <div class="flex min-h-screen w-full p-4 py-8 overflow-y-auto">
        
        <!-- Menggunakan 'm-auto' agar selalu ke tengah tapi tetap bisa di-scroll kalau keyboard muncul -->
        <div class="m-auto max-w-lg w-full bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] relative">
            
            <!-- Header Section (Hijau) -->
            <div class="bg-brutal-green border-b-4 border-black p-5 md:p-6 text-center">
                <h2 class="text-2xl md:text-3xl font-bold uppercase tracking-tighter">Data Seniman</h2>
                <p class="text-black text-sm mt-2 font-bold uppercase">Lengkapi profil seniman PARTSY!!!</p>
            </div>

            <!-- Body Form -->
            <div class="p-6 md:p-8">
                <form id="submit-to-google-sheet" class="space-y-6">
                    
                    <!-- Input Nama -->
                    <div>
                        <label for="Nama" class="block text-base font-bold uppercase mb-2">Nama Seniman</label>
                        <!-- text-base (16px) wajib agar layar tidak auto-zoom di HP -->
                        <input type="text" id="Nama" name="Nama" required 
                            class="w-full px-4 py-3 bg-white border-4 border-black focus:outline-none focus:bg-brutal-yellow focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:-translate-y-1 focus:-translate-x-1 transition-all font-bold placeholder-gray-400 text-base"
                            placeholder="MASUKKAN NAMA">
                    </div>

                    <!-- Input Asal -->
                    <div>
                        <label for="Asal" class="block text-base font-bold uppercase mb-2">Asal</label>
                        <input type="text" id="Asal" name="Asal" required 
                            class="w-full px-4 py-3 bg-white border-4 border-black focus:outline-none focus:bg-brutal-yellow focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:-translate-y-1 focus:-translate-x-1 transition-all font-bold placeholder-gray-400 text-base"
                            placeholder="KOTA ASAL">
                    </div>

                    <!-- Input Bio -->
                    <div>
                        <label for="Bio" class="block text-base font-bold uppercase mb-2">Bio</label>
                        <textarea id="Bio" name="Bio" rows="4" required
                            class="w-full px-4 py-3 bg-white border-4 border-black focus:outline-none focus:bg-brutal-yellow focus:shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] focus:-translate-y-1 focus:-translate-x-1 transition-all font-bold resize-none placeholder-gray-400 text-base"
                            placeholder="TULIS BIO SENIMAN DI SINI..."></textarea>
                    </div>

                    <!-- Tombol Submit -->
                    <button type="submit" id="submit-btn"
                        class="w-full mt-4 bg-brutal-blue hover:bg-blue-500 text-white font-bold uppercase text-lg py-4 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] hover:shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] hover:-translate-y-1 hover:-translate-x-1 active:shadow-[0px_0px_0px_0px_rgba(0,0,0,1)] active:translate-y-1 active:translate-x-1 transition-all flex justify-center items-center">
                        <span id="btn-text">Kirim Data</span>
                        <!-- Loading spinner -->
                        <svg id="btn-spinner" class="hidden animate-spin ml-3 h-6 w-6 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </button>
                </form>

                <!-- Pesan Sukses -->
                <div id="success-message" class="hidden mt-6 p-4 bg-brutal-green border-4 border-black font-bold uppercase text-center shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                    BERHASIL! DATA TERKIRIM.
                </div>
                
                <!-- Pesan Error -->
                <div id="error-message" class="hidden mt-6 p-4 bg-red-400 border-4 border-black font-bold uppercase text-center shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] text-white">
                    ERROR! SILAKAN COBA LAGI.
                </div>
            </div>
        </div>
    </div>

    <!-- Script Logika Form ke Spreadsheet -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzC6FuF5hvpM9Wq6_e-nL5j634OGjdhRlYVtMgP0JOmpuEZixzFNYWtTuIv3mgotChn/exec'; 
        const form = document.forms['submit-to-google-sheet'];
        
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const successMessage = document.getElementById('success-message');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            submitBtn.disabled = true;
            btnText.textContent = 'MENGIRIM...';
            btnSpinner.classList.remove('hidden');
            successMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');

            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    submitBtn.disabled = false;
                    btnText.textContent = 'KIRIM DATA';
                    btnSpinner.classList.add('hidden');
                    
                    successMessage.classList.remove('hidden');
                    form.reset();
                    
                    setTimeout(() => {
                        successMessage.classList.add('hidden');
                    }, 5000);
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    submitBtn.disabled = false;
                    btnText.textContent = 'KIRIM DATA';
                    btnSpinner.classList.add('hidden');
                    
                    errorMessage.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
