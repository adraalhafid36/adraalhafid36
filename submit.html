<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pengisian Data</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden p-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold text-slate-800">Kirim Data</h2>
            <p class="text-slate-500 text-sm mt-2">Silakan isi</p>
        </div>

        <form id="submit-to-google-sheet" class="space-y-5">
            <div>
                <label for="Nama" class="block text-sm font-medium text-slate-700 mb-1">Nama Seniman</label>
                <input type="text" id="Nama" name="Nama" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="Masukkan nama Seniman">
            </div>

            <div>
                <label for="Asal" class="block text-sm font-medium text-slate-700 mb-1">Asal</label>
                <input type="Asal" id="Asal" name="Asal" required 
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                    placeholder="Asal">
            </div>

            <div>
                <label for="Bio" class="block text-sm font-medium text-slate-700 mb-1">Bio</label>
                <textarea id="Bio" name="Bio" rows="4" required
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all resize-none"
                    placeholder="Tulis bio Anda di sini..."></textarea>
            </div>

            <button type="submit" id="submit-btn"
                class="w-full bg-slate-800 hover:bg-slate-900 text-white font-semibold py-3 px-4 rounded-lg transition-colors flex justify-center items-center">
                <span id="btn-text">Kirim Data</span>
                <!-- Loading spinner (hidden by default) -->
                <svg id="btn-spinner" class="hidden animate-spin ml-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </button>
        </form>

        <!-- Pesan Sukses -->
        <div id="success-message" class="hidden mt-4 p-4 bg-green-50 text-green-700 rounded-lg border border-green-200 text-sm text-center">
            Terima kasih! Data berhasil dikirim.
        </div>
        
        <!-- Pesan Error -->
        <div id="error-message" class="hidden mt-4 p-4 bg-red-50 text-red-700 rounded-lg border border-red-200 text-sm text-center">
            Terjadi kesalahan. Silakan coba lagi.
        </div>
    </div>

    <script>
        // GANTI STRING DI BAWAH INI DENGAN URL WEB APP DARI GOOGLE APPS SCRIPT
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzC6FuF5hvpM9Wq6_e-nL5j634OGjdhRlYVtMgP0JOmpuEZixzFNYWtTuIv3mgotChn/exec'; 
        const form = document.forms['submit-to-google-sheet'];
        
        const submitBtn = document.getElementById('submit-btn');
        const btnText = document.getElementById('btn-text');
        const btnSpinner = document.getElementById('btn-spinner');
        const successMessage = document.getElementById('success-message');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', e => {
            e.preventDefault();
            
            // Tampilan state loading
            submitBtn.disabled = true;
            btnText.textContent = 'Mengirim...';
            btnSpinner.classList.remove('hidden');
            successMessage.classList.add('hidden');
            errorMessage.classList.add('hidden');

            // Mengirim data form via Fetch API
            fetch(scriptURL, { method: 'POST', body: new FormData(form) })
                .then(response => {
                    // Reset tombol
                    submitBtn.disabled = false;
                    btnText.textContent = 'Kirim Data';
                    btnSpinner.classList.add('hidden');
                    
                    // Tampilkan pesan sukses & reset form
                    successMessage.classList.remove('hidden');
                    form.reset();
                    
                    // Sembunyikan pesan sukses setelah 5 detik
                    setTimeout(() => {
                        successMessage.classList.add('hidden');
                    }, 5000);
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    // Reset tombol
                    submitBtn.disabled = false;
                    btnText.textContent = 'Kirim Data';
                    btnSpinner.classList.add('hidden');
                    
                    // Tampilkan pesan error
                    errorMessage.classList.remove('hidden');
                });
        });
    </script>
</body>
</html>
